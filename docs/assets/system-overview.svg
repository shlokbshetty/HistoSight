<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="sslGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="xaiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.08"/>
    </linearGradient>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" rx="14" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="46" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">HistoSight — Stain-Invariant SimCLR &amp; Explainable AI System Architecture</text>
  <text x="40" y="70" fill="#94a3b8" font-size="13">Macenko optical density stain normalization, SimCLR ResNet-18 contrastive learning, linear/fine-tuned probe, 6-method XAI suite, and FastAPI service</text>
  <line x1="40" y1="86" x2="1160" y2="86" stroke="#1e293b" stroke-width="1.5"/>

  <!-- TIER 1: Histopathology Data & Macenko Normalization -->
  <rect x="40" y="106" width="265" height="545" rx="10" fill="url(#dataGrad)" stroke="#0d9488" stroke-width="1.5"/>
  <text x="60" y="134" fill="#2dd4bf" font-size="14" font-weight="700" letter-spacing="0.8">1. DATA &amp; STAIN NORMALIZATION</text>
  <text x="60" y="152" fill="#94a3b8" font-size="11">PCam HDF5 Splits &amp; Optical Density</text>

  <!-- PCam HDF5 Storage -->
  <rect x="60" y="174" width="225" height="115" rx="8" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.2"/>
  <text x="76" y="200" fill="#f1f5f9" font-size="13" font-weight="600">PCam Dataset &amp; SSL Splits</text>
  <text x="76" y="218" fill="#94a3b8" font-size="11">simclr/ssl_splits/*.h5 (96x96x3)</text>
  <text x="76" y="236" fill="#cbd5e1" font-size="10" font-family="monospace">- train_unlabeled_x.h5 (20k)</text>
  <text x="76" y="252" fill="#cbd5e1" font-size="10" font-family="monospace">- val_labeled_x/y.h5 (8k)</text>
  <text x="76" y="268" fill="#cbd5e1" font-size="10" font-family="monospace">- test_labeled_x/y.h5 (8k)</text>

  <!-- Macenko Stain Normalizer -->
  <rect x="60" y="314" width="225" height="140" rx="8" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.2"/>
  <text x="76" y="340" fill="#f1f5f9" font-size="13" font-weight="600">Macenko Stain Normalizer</text>
  <text x="76" y="358" fill="#94a3b8" font-size="11">stain_norm.py &amp; normalize_dataset.py</text>
  <text x="76" y="378" fill="#cbd5e1" font-size="11">torchstain.MacenkoNormalizer</text>
  <text x="76" y="396" fill="#2dd4bf" font-size="10" font-family="monospace">Ref: checkpoints/template.png</text>
  <text x="76" y="414" fill="#94a3b8" font-size="11">H&amp;E Optical Density SVD Fit</text>
  <text x="76" y="432" fill="#94a3b8" font-size="11">Chunked H5 Pre-Normalizer (1k)</text>

  <!-- SimCLR Stochastic Augmentation -->
  <rect x="60" y="478" width="225" height="150" rx="8" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.2"/>
  <text x="76" y="504" fill="#f1f5f9" font-size="13" font-weight="600">SimCLR Dual-View Augmenter</text>
  <text x="76" y="522" fill="#94a3b8" font-size="11">SimCLRTransform (train.py)</text>
  <text x="76" y="542" fill="#cbd5e1" font-size="10" font-family="monospace">RandomResizedCrop(96, 0.2-1.0)</text>
  <text x="76" y="558" fill="#cbd5e1" font-size="10" font-family="monospace">RandomHFlip() + RandomVFlip()</text>
  <text x="76" y="574" fill="#cbd5e1" font-size="10" font-family="monospace">ColorJitter(0.2,0.2,0.2,0.05)</text>
  <text x="76" y="596" fill="#2dd4bf" font-size="11">Emits Correlated Pair (x_1, x_2)</text>

  <!-- TIER 2: Self-Supervised Pre-Training & Downstream Fine-Tuning -->
  <rect x="335" y="106" width="265" height="545" rx="10" fill="url(#sslGrad)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="355" y="134" fill="#a78bfa" font-size="14" font-weight="700" letter-spacing="0.8">2. SIMCLR &amp; LINEAR EVALUATION</text>
  <text x="355" y="152" fill="#94a3b8" font-size="11">Contrastive Pre-Train &amp; Classifier</text>

  <!-- SimCLR Pre-Training -->
  <rect x="355" y="174" width="225" height="145" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="371" y="200" fill="#f1f5f9" font-size="13" font-weight="600">SimCLRModel (train.py)</text>
  <text x="371" y="218" fill="#94a3b8" font-size="11">Backbone: ResNet-18 (fc=Identity)</text>
  <text x="371" y="236" fill="#cbd5e1" font-size="11">Latent Representation: h in R^512</text>
  <text x="371" y="254" fill="#cbd5e1" font-size="10" font-family="monospace">Projector: 512-&gt;ReLU-&gt;512-&gt;128</text>
  <text x="371" y="272" fill="#a78bfa" font-size="11" font-weight="600">NT-Xent InfoNCE Loss (tau=0.5)</text>
  <text x="371" y="292" fill="#94a3b8" font-size="10" font-family="monospace">ckpt: checkpoints/best_simclr.pth</text>

  <!-- Downstream Fine-Tuning -->
  <rect x="355" y="340" width="225" height="150" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="371" y="366" fill="#f1f5f9" font-size="13" font-weight="600">Linear Probe &amp; Fine-Tuning</text>
  <text x="371" y="384" fill="#94a3b8" font-size="11">fine_tune.py &amp; evaluate.py</text>
  <text x="371" y="404" fill="#cbd5e1" font-size="11">Mode A: Frozen 512-d Feature Probe</text>
  <text x="371" y="422" fill="#cbd5e1" font-size="11">Mode B: Unfrozen layer4 + Linear</text>
  <text x="371" y="440" fill="#cbd5e1" font-size="10" font-family="monospace">Classifier: nn.Linear(512, 2)</text>
  <text x="371" y="458" fill="#a78bfa" font-size="10" font-family="monospace">models/best_classifier.pth</text>
  <text x="371" y="474" fill="#a78bfa" font-size="10" font-family="monospace">models/best_encoder.pth</text>

  <!-- Baseline Benchmarking Suite -->
  <rect x="355" y="510" width="225" height="118" rx="8" fill="#0f172a" stroke="#64748b" stroke-dasharray="4 3" stroke-width="1.2"/>
  <text x="371" y="536" fill="#f1f5f9" font-size="13" font-weight="600">Supervised Baseline Suite</text>
  <text x="371" y="554" fill="#94a3b8" font-size="11">compare_baselines.py (LBFGS Probe)</text>
  <text x="371" y="572" fill="#cbd5e1" font-size="10" font-family="monospace">- ResNet18 / ResNet50 (ImageNet)</text>
  <text x="371" y="588" fill="#cbd5e1" font-size="10" font-family="monospace">- EfficientNet-B0 / MobileNetV3</text>
  <text x="371" y="608" fill="#a78bfa" font-size="10" font-family="monospace">Output: logs/comparison.json</text>

  <!-- TIER 3: Inference & Explainable AI (XAI) Engine -->
  <rect x="630" y="106" width="265" height="545" rx="10" fill="url(#xaiGrad)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="650" y="134" fill="#60a5fa" font-size="14" font-weight="700" letter-spacing="0.8">3. INFERENCE &amp; XAI ENGINE</text>
  <text x="650" y="152" fill="#94a3b8" font-size="11">Diagnostic Scoring &amp; Saliency Maps</text>

  <!-- Inference Engine -->
  <rect x="650" y="174" width="225" height="135" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="666" y="200" fill="#f1f5f9" font-size="13" font-weight="600">Diagnostic Inference Core</text>
  <text x="666" y="218" fill="#94a3b8" font-size="11">inference.py (CUDA AMP Autocast)</text>
  <text x="666" y="238" fill="#cbd5e1" font-size="10" font-family="monospace">Mean:[0.701, 0.586, 0.705]</text>
  <text x="666" y="254" fill="#cbd5e1" font-size="10" font-family="monospace">Std: [0.213, 0.244, 0.196]</text>
  <text x="666" y="272" fill="#60a5fa" font-size="11">predict_single() &amp; predict_batch()</text>
  <text x="666" y="290" fill="#34d399" font-size="11" font-weight="600">Classes: {0: Normal, 1: Tumor}</text>

  <!-- 6-Method XAI Suite -->
  <rect x="650" y="330" width="225" height="190" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="666" y="356" fill="#f1f5f9" font-size="13" font-weight="600">Multi-Modal XAI Suite</text>
  <text x="666" y="374" fill="#94a3b8" font-size="11">explainability.py (96x96 Heatmaps)</text>
  <text x="666" y="396" fill="#cbd5e1" font-size="11">1. Grad-CAM (layer4 activations)</text>
  <text x="666" y="414" fill="#cbd5e1" font-size="11">2. SmoothGrad (N=50, sigma=0.15)</text>
  <text x="666" y="432" fill="#cbd5e1" font-size="11">3. Vanilla Gradient Saliency</text>
  <text x="666" y="450" fill="#cbd5e1" font-size="11">4. Occlusion (16x16 patch, s=8)</text>
  <text x="666" y="468" fill="#cbd5e1" font-size="11">5. LIME Superpixel Perturbation</text>
  <text x="666" y="486" fill="#cbd5e1" font-size="11">6. SHAP GradientExplainer</text>
  <text x="666" y="506" fill="#60a5fa" font-size="10" font-family="monospace">Normalized [0.0, 1.0] Saliency Matrix</text>

  <!-- Metrics & Graph Exporter -->
  <rect x="650" y="540" width="225" height="88" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="666" y="566" fill="#f1f5f9" font-size="13" font-weight="600">Telemetry &amp; Graph Renderer</text>
  <text x="666" y="584" fill="#94a3b8" font-size="11">generate_graphs.py &amp; logs/*.json</text>
  <text x="666" y="602" fill="#cbd5e1" font-size="10" font-family="monospace">graphs/loss|accuracy|comparison.png</text>

  <!-- TIER 4: FastAPI Microservice & Clinical Console -->
  <rect x="925" y="106" width="235" height="545" rx="10" fill="url(#apiGrad)" stroke="#d97706" stroke-width="1.5"/>
  <text x="945" y="134" fill="#fbbf24" font-size="14" font-weight="700" letter-spacing="0.8">4. API &amp; CLINICAL CONSOLE</text>
  <text x="945" y="152" fill="#94a3b8" font-size="11">FastAPI Service &amp; Web UI</text>

  <!-- FastAPI Backend -->
  <rect x="945" y="174" width="195" height="235" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="961" y="200" fill="#f1f5f9" font-size="13" font-weight="600">FastAPI Diagnostic API</text>
  <text x="961" y="218" fill="#94a3b8" font-size="11">backend/main.py (Port 8000)</text>
  <text x="961" y="240" fill="#fbbf24" font-size="10" font-family="monospace">GET  / &amp; /health</text>
  <text x="961" y="258" fill="#fbbf24" font-size="10" font-family="monospace">POST /predict (UploadFile)</text>
  <text x="961" y="276" fill="#fbbf24" font-size="10" font-family="monospace">POST /batch_predict</text>
  <text x="961" y="294" fill="#fbbf24" font-size="10" font-family="monospace">POST /gradcam</text>
  <text x="961" y="312" fill="#fbbf24" font-size="10" font-family="monospace">POST /explain?method=...</text>
  <text x="961" y="330" fill="#fbbf24" font-size="10" font-family="monospace">GET  /metrics &amp; /comparison</text>
  <text x="961" y="348" fill="#fbbf24" font-size="10" font-family="monospace">POST /train_baseline</text>
  <text x="961" y="366" fill="#fbbf24" font-size="10" font-family="monospace">GET  /train_baseline/status</text>
  <text x="961" y="384" fill="#fbbf24" font-size="10" font-family="monospace">GET  /graphs/{filename}</text>

  <!-- Clinical Web Console -->
  <rect x="945" y="430" width="195" height="198" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="961" y="456" fill="#f1f5f9" font-size="13" font-weight="600">Histopathology Web UI</text>
  <text x="961" y="474" fill="#94a3b8" font-size="11">index.html (Interactive Console)</text>
  <text x="961" y="496" fill="#cbd5e1" font-size="11">- Drag &amp; Drop Patch Upload</text>
  <text x="961" y="514" fill="#cbd5e1" font-size="11">- Live 96x96 Canvas Overlay</text>
  <text x="961" y="532" fill="#cbd5e1" font-size="11">- 6-Method XAI Selector</text>
  <text x="961" y="550" fill="#cbd5e1" font-size="11">- Batch Folder Evaluator</text>
  <text x="961" y="568" fill="#cbd5e1" font-size="11">- Baseline Subprocess Trigger</text>
  <text x="961" y="586" fill="#cbd5e1" font-size="11">- Training Curves Viewer</text>

  <!-- DATA FLOW ARROWS -->
  <!-- PCam -> Macenko -->
  <line x1="172" y1="289" x2="172" y2="308" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <!-- Macenko -> Augmenter -->
  <line x1="172" y1="454" x2="172" y2="472" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <!-- Augmenter -> SimCLR -->
  <path d="M 285 550 L 315 550 L 315 245 L 349 245" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="290" y="235" fill="#a78bfa" font-size="10">(x_1, x_2)</text>

  <!-- SimCLR -> Fine-Tune -->
  <line x1="467" y1="319" x2="467" y2="334" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="475" y="331" fill="#a78bfa" font-size="10">512-d weights</text>

  <!-- Fine-Tune -> Inference Core -->
  <path d="M 580 415 L 612 415 L 612 240 L 644 240" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="585" y="230" fill="#60a5fa" font-size="10">.pth weights</text>

  <!-- Inference Core <-> XAI Suite -->
  <line x1="762" y1="309" x2="762" y2="324" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Inference & XAI -> FastAPI -->
  <line x1="875" y1="245" x2="939" y2="245" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="875" y1="400" x2="910" y2="400 L 910 310 L 939 310" stroke="#fbbf24" stroke-width="2" fill="none" marker-end="url(#arrowAmber)"/>

  <!-- FastAPI <-> Web Console -->
  <line x1="1042" y1="409" x2="1042" y2="424" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- LEGEND FOOTER -->
  <rect x="40" y="672" width="1120" height="100" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="60" y="698" fill="#f8fafc" font-size="13" font-weight="700">VISUAL LEGEND &amp; ARCHITECTURAL BOUNDARIES</text>

  <rect x="60" y="716" width="16" height="16" rx="3" fill="#0d9488" fill-opacity="0.4" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="84" y="729" fill="#cbd5e1" font-size="12">H&amp;E Ingestion &amp; Macenko Normalization</text>

  <rect x="350" y="716" width="16" height="16" rx="3" fill="#7c3aed" fill-opacity="0.4" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="374" y="729" fill="#cbd5e1" font-size="12">SimCLR Contrastive SSL &amp; Fine-Tuning</text>

  <rect x="650" y="716" width="16" height="16" rx="3" fill="#2563eb" fill-opacity="0.4" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="674" y="729" fill="#cbd5e1" font-size="12">Diagnostic Inference &amp; 6-Method XAI</text>

  <rect x="945" y="716" width="16" height="16" rx="3" fill="#d97706" fill-opacity="0.4" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="969" y="729" fill="#cbd5e1" font-size="12">FastAPI Service &amp; Clinical Web UI</text>

  <line x1="60" y1="752" x2="95" y2="752" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="105" y="756" fill="#94a3b8" font-size="11">Self-Supervised Representation &amp; Checkpoint Flow</text>

  <line x1="430" y1="752" x2="465" y2="752" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="475" y="756" fill="#94a3b8" font-size="11">REST Multipart / JSON Diagnostic &amp; Saliency Payloads</text>

  <rect x="830" y="744" width="24" height="14" rx="2" fill="#0f172a" stroke="#64748b" stroke-dasharray="3 2" stroke-width="1.2"/>
  <text x="862" y="756" fill="#94a3b8" font-size="11">Supervised Baseline Benchmark Subprocess</text>
</svg>
